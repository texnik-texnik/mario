<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBER DASH // Synthwave Platformer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- Touch Overlay for Mobile/Tablet in Portrait & Landscape -->
        <div id="touch-controls">
            <div class="dpad">
                <button id="btn-left" class="touch-btn">◄</button>
                <button id="btn-right" class="touch-btn">►</button>
            </div>
            <button id="btn-jump" class="touch-btn jump-btn">▲ JUMP</button>
        </div>
    </div>
    <script src="levels.js"></script>
    <script src="script.js"></script>
</body>
</html>
